[project]
name = "civicinbox"
version = "0.1.0"
description = "AI-assisted request-triage system for small organizations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "scikit-learn>=1.9.0",
    "joblib>=1.5.3",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.52",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "httpx",
]
ui = [
    "streamlit>=1.64.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]

[tool.ruff.lint]
ignore = ["B008"]