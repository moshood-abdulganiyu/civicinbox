name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Train baseline model
        run: uv run python scripts/train_baseline.py

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest --cov=app



docker:
  runs-on: ubuntu-latest
  needs: test

  steps:
    - uses: actions/checkout@v4

    - name: Build image
      run: docker build -t civicinbox .

    - name: Smoke test container
      run: |
        docker run -d -p 8000:8000 --name civicinbox-test civicinbox
        sleep 5
        curl --fail http://localhost:8000/health
        docker stop civicinbox-test